# DDQN Training Configuration for Unity ML-Agents
# Uses custom ddqn trainer plugin (mlagents-plugin-ddqn)
#
# Installation:
#   cd ml_agents_plugin
#   pip install -e .
#
# Usage:
#   mlagents-learn config/ddqn.yaml --run-id=ddqn_dda_v1 --train
#
# Observations (8 total):
#   1. HP Ratio (current/max)
#   2. Turn Count (normalized, cap 15)
#   3. Player Level (normalized, cap 5)
#   4. Damage Dealt Ratio (dealt / totalEnemyHP in area)
#   5. QTE Accuracy (successful QTE / total QTE opportunities)
#   6. Resource Depletion (avg depletion of actions)
#   7. Area Progress Ratio (completed/total)
#   8. Current Difficulty (index/4, normalized)
#
# Actions (5 discrete — absolute difficulty level):
#   0 = Very Easy
#   1 = Easy
#   2 = Normal
#   3 = Hard
#   4 = Very Hard
# NOTE: Set BehaviorParameters on the DDAAgent GameObject
#       (Space Size / Discrete Branch Size) to 5 to match.
#
# Reward (based on battleSurvivalRatio = player_hp_end / player_hp_start):
#   - Loss: -1.0
#   - Win, survivalRatio in [0.4, 0.6]: 1 - 25*(ratio - 0.5)^2 (parabolic peak at 50%)
#   - Win, survivalRatio < 0.4: 0.1 * ratio
#   - Win, survivalRatio > 0.6: 0.1 * (1 - ratio)
#   - Progressive weighting: 0.5 + 0.5 * progress
#   - Run win bonus: +0.5
#   - Death penalty: -0.5 (when player dies mid-run)
#   - Run loss penalty: -0.1 (when run ends without death)

behaviors:
  ddqn_dda:
    trainer_type: ddqn # Custom DDQN trainer from plugin

    hyperparameters:
      # Learning
      learning_rate: 0.0003
      learning_rate_schedule: constant

      # Experience Replay
      batch_size: 128
      buffer_size: 10000

      # DDQN - Target Network Update
      tau: 0.005 # Soft update rate

      # Exploration (Epsilon-greedy)
      exploration_initial_eps: 1.0
      exploration_final_eps: 0.03
      exploration_decay_steps: 250000

      # Discount factor
      gamma: 0.99

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    # Training settings

    keep_checkpoints: 5
    max_steps: 1000000
    # time_horizon: 64
    summary_freq: 5000
    checkpoint_interval: 50000

# Environment settings
env_settings:
  env_path: null
  base_port: 5005
  num_envs: 8
  num_areas: 1
  timeout_wait: 60
  seed: -1

# Engine settings for training
engine_settings:
  width: 84
  height: 84
  quality_level: 5
  time_scale: 100
  target_frame_rate: -1
  capture_frame_rate: 60
  no_graphics: true

# Checkpoint settings
checkpoint_settings:
  run_id: ddqn_dda_v1
  initialize_from: null
  load_model: false
  resume: false
  force: false
  train_model: true
  inference: false
  results_dir: results

# Debug settings
debug: false
